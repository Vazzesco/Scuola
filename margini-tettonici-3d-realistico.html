 if(x<-1)n=(fbm(x*1.5,z*1.5)-.5)*.25*(1+2*Math.exp(-Math.pow((x+6)/1.5,2)))*(1-.9*Math.exp(-Math.pow((x+6)/.45,2)));
 else n=(fbm(x*.9,z*.9+7)-.45)*(.6+1.6*sm(3,9,x))*sm(0,3,x);
 let h=T(x)+n*f;
 for(const zz of VZ){const r2=(x-3)**2+(z-zz)**2;h+=1.4*Math.exp(-r2/.5)-.35*Math.exp(-r2/.06);}
 return h;}
function colr(x,z,h){
 let r,g,b;
 if(x<-1){const k=Math.exp(-Math.pow((x+6)/1.6,2));r=.40-.22*k;g=.35-.18*k;b=.29-.1*k;}
 else if(h<1.35){r=.2;g=.38;b=.17;if(x<0.5){r=.7;g=.65;b=.45;}}
 else if(h<2.1){const t=sm(1.35,2.1,h);r=.2+.22*t;g=.38-.05*t;b=.17+.08*t;}
 else{const t=sm(2.1,3,h);r=.42+.42*t;g=.33+.5*t;b=.25+.55*t;}
 for(const zz of VZ){const rr=Math.hypot(x-3,z-zz);
  if(rr<.9&&h>1.9){const t=sm(.9,.4,rr);r+=(.2-r)*t;g+=(.18-g)*t;b+=(.17-b)*t;
   const c=sm(.3,.1,rr);r+=(1-r)*c;g+=(.25-g)*c;b+=(.05-b)*c;}}
 return[r,g,b];}

{const p=tg.attributes.position,cl=new Float32Array(p.count*3);

  const y=Math.random()*256,a=Math.random()*6+2,f=Math.random()*.05+.02;g.beginPath();
  for(let x=0;x<=256;x+=8){const yy=y+Math.sin(x*f*6.283)*a;x?g.lineTo(x,yy):g.moveTo(x,yy);}g.stroke();}
 g.globalAlpha=.25;for(let i=0;i<2500;i++){g.fillStyle=Math.random()<.5?dark:light;g.fillRect(Math.random()*256,Math.random()*256,2,2);}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.MirroredRepeatWrapping;t.repeat.set(rep,rep);TX.push({t,k});
 if(k){const im=new Image();im.onload=()=>{g.globalCompositeOperation='overlay';g.globalAlpha=.85;g.drawImage(im,0,0,256,256);t.needsUpdate=true;};im.src=IMG[k];}
 return t;}

const ptr=new Map();let pd=0;
const dist=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==2)pd=dist();});

 else{ptr.set(e.pointerId,[e.clientX,e.clientY]);const d=dist();rad=Math.min(50,Math.max(8,rad*pd/d));pd=d;}});

function frame0(now){

  const wp=wg.attributes.position;for(let i=0;i<wp.count;i++){const x=wbase[i*3],z=wbase[i*3+2];wp.setY(i,.85+.035*Math.sin(x*2.2+tm*1.6)+.025*Math.sin(z*3+tm*1.2+x));}

  let a=smoke.geometry.attributes.position;

  a.needsUpdate=true;

  for(let i=0;i<45;i++){la[i]=(la[i]+dt*.7)%1;const t=la[i],ang=i*2.4,r=t*.9;a.setXYZ(i,3+Math.cos(ang)*r,cy+Math.sin(t*Math.PI)*1.2,VZ[1]+Math.sin(ang)*r);}
  a.needsUpdate=true;
  a=mrise.geometry.attributes.position;
  for(let i=0;i<30;i++){ma[i]=(ma[i]+dt*.12)%1;const p=mp.getPointAt(ma[i]);a.setXYZ(i,p.x+Math.sin(i*3+tm*2)*.1,p.y,p.z+.05);}
  a.needsUpdate=true;
  quakes.forEach(q=>{const k=Math.max(0,Math.sin(tm*1.5+q.p*3));q.m.material.opacity=k*k;q.m.scale.setScalar(.6+k*1.6);});
  stL.offset.x+=dt*.1;stR.offset.x-=dt*.1;TX[1].t.offset.x-=dt*.004;TX[2].t.offset.x+=dt*.015;TX[3].t.offset.x-=dt*.008;fis.scale.y=1+.4*Math.sin(tm*5);

}
